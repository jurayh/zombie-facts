<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" role="img" aria-label="Retrieval dead rate by tie epsilon: 87.5 percent at 0.05, 79.2 at 0.02 as run, 77.1 at 0.01, 70.8 at 0.005, 66.7 at 0.002 and at pure top-1. Tightening helps, then plateaus.">
  <style>
    text { font-family: Helvetica, Arial, sans-serif; fill: #1c1c1c; }
    .grid { font-size: 12px; fill: #888; text-anchor: end; }
    .xlab { font-size: 13px; text-anchor: middle; }
    .vlab { font-size: 13px; font-weight: 600; text-anchor: middle; fill: #1a5fb4; }
    .vlab-run { font-size: 13px; font-weight: 600; text-anchor: middle; fill: #b03a2e; }
    .note { font-size: 13px; fill: #666; }
  </style>
  <text x="360" y="20" font-size="16" font-weight="600" text-anchor="middle">Tightening epsilon helps — then plateaus</text>
  <!-- gridlines -->
  <line x1="60" y1="230" x2="690" y2="230" stroke="#ddd"/>
  <line x1="60" y1="163" x2="690" y2="163" stroke="#eee"/>
  <line x1="60" y1="97" x2="690" y2="97" stroke="#eee"/>
  <line x1="60" y1="30" x2="690" y2="30" stroke="#eee"/>
  <text x="52" y="234" class="grid">60%</text>
  <text x="52" y="167" class="grid">70%</text>
  <text x="52" y="101" class="grid">80%</text>
  <text x="52" y="34" class="grid">90%</text>
  <!-- pure top-1 floor -->
  <line x1="60" y1="185" x2="690" y2="185" stroke="#999" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="64" y="178" class="note">pure top-1 floor (66.7%)</text>
  <!-- data line -->
  <polyline points="80,47 200,102 320,116 440,158 560,185 680,185" fill="none" stroke="#1a5fb4" stroke-width="2.5"/>
  <!-- points and labels -->
  <circle cx="80" cy="47" r="5" fill="#1a5fb4"/>
  <text x="80" y="34" class="vlab">87.5%</text>
  <circle cx="200" cy="102" r="7" fill="#b03a2e"/>
  <text x="200" y="89" class="vlab-run">79.2%</text>
  <text x="200" y="128" class="vlab-run">as run</text>
  <circle cx="320" cy="116" r="5" fill="#1a5fb4"/>
  <text x="320" y="103" class="vlab">77.1%</text>
  <circle cx="440" cy="158" r="5" fill="#1a5fb4"/>
  <text x="440" y="145" class="vlab">70.8%</text>
  <circle cx="560" cy="185" r="5" fill="#1a5fb4"/>
  <text x="560" y="172" class="vlab">66.7%</text>
  <circle cx="680" cy="185" r="5" fill="#1a5fb4"/>
  <text x="680" y="172" class="vlab">66.7%</text>
  <!-- x axis -->
  <line x1="60" y1="240" x2="690" y2="240" stroke="#999"/>
  <text x="80" y="258" class="xlab">0.05</text>
  <text x="200" y="258" class="xlab">0.02</text>
  <text x="320" y="258" class="xlab">0.01</text>
  <text x="440" y="258" class="xlab">0.005</text>
  <text x="560" y="258" class="xlab">0.002</text>
  <text x="680" y="258" class="xlab">0.0</text>
  <text x="375" y="282" class="note" text-anchor="middle">Tie epsilon, categories in order (not to scale) — 48 action updates, embedding retriever</text>
</svg>
